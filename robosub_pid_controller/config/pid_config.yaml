robosub_pid_controller:
  ros__parameters:
    linear_x:
      kp: 2.0
      ki: 0.0
      kd: 2.0
    
    linear_y:
      kp: 3.0
      ki: 0.0
      kd: 3.0
    
    linear_z:
      kp: 1.7
      ki: 0.0
      kd: 1.5
    
    angular_x:
      kp: 0.0
      ki: 0.0
      kd: 0.0
    
    angular_y:
      kp: 0.0
      ki: 0.0
      kd: 0.0
    
    angular_z:
      kp: 0.0
      ki: 0.0
      kd: 0.0
    
    linear_output_limit: 2.0
    angular_output_limit: 1.5
    
    # Integral limits (anti-windup)
    linear_integral_limit: 1.0
    angular_integral_limit: 0.5
    
    # Control parameters
    enable_position_hold: true
    enable_orientation_hold: true
    velocity_feedback_weight: 0.8
    
    # Tuning helper parameters
    control_frequency: 50.0  # Hz
    deadband_linear: 0.01    # m/s
    deadband_angular: 0.01   # rad/s 